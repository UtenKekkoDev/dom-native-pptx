name: CI

on:
  push:
  pull_request:

env:
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: runner.os == 'Linux'
        run: npx --no-install playwright install --with-deps chromium
      - if: runner.os != 'Linux'
        run: npx --no-install playwright install chromium
      - run: npm run build
      - run: npm run test:run
      - run: npm run test:package
