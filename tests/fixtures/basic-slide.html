<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
      }
      .pptx-slide {
        position: relative;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #ffffff;
      }
      h1 {
        position: absolute;
        left: 120px;
        top: 100px;
        margin: 0;
        font: 700 64px "Microsoft YaHei";
        color: #20152a;
      }
      p {
        position: absolute;
        left: 120px;
        top: 220px;
        width: 900px;
        margin: 0;
        font: 400 30px/1.5 "Microsoft YaHei";
        color: #3c3344;
      }
    </style>
  </head>
  <body>
    <section class="pptx-slide" data-pptx-slide="1">
      <h1 id="title" data-pptx-text-role="title">原生标题</h1>
      <p id="body" data-pptx-text-role="body">
        正文必须保持为 PowerPoint 原生文本框。
      </p>
    </section>
  </body>
</html>
